[project]
name = "reminder-bot"
version = "0.1.0"
description = "Private Telegram reminder bot"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.13"
dependencies = [
    "aiogram>=3.31.0",
    "aiosqlite>=0.22.1",
    "alembic>=1.20.1",
    "pydantic-settings>=2.16.1",
    "python-dateutil>=3.0.0",
    "sqlalchemy[asyncio]>=2.1.6",
    "tzdata>=2026.5",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "ASYNC", "PTH", "C4", "PIE", "RET"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pyyaml>=6.0.3",
    "ruff>=0.17.1",
    "time-machine>=3.5.1",
    "types-python-dateutil>=2.9.0.20261021",
    "types-pyyaml>=6.0.12.20260906",
]
