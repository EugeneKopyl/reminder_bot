name: reminder-bot

services:
  bot:
    image: ghcr.io/eugenekopyl/reminder-bot:${BOT_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: deploy/bot.Dockerfile
    env_file: .env
    environment:
      DATABASE_PATH: /data/bot.sqlite3
    volumes:
      - bot-data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  bot-data:
